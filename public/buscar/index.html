<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscar cartas · valtatcg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global/global.css">
  <link rel="stylesheet" href="../assets/css/project/project.css">
</head>
<body class="app">
  <header class="topo flex items--center justify--content--between px--6 bg--surface border--bottom">
    <a href="/colecao/" class="flex items--center gap--2">
      <span class="marca--ponto bg--primary"></span>
      <span class="weight--bold tracking--tight">valtatcg</span>
    </a>
    <nav class="flex items--center gap--5 topo--links">
      <a href="/colecao/" class="nao--encolhe text--muted">Coleção</a>
      <a href="/buscar/" class="nao--encolhe weight--semibold">Buscar cartas</a>
      <a href="/assinatura/" class="nao--encolhe text--muted">Assinatura</a>
      <a href="/admin/" class="nao--encolhe text--muted hidden" id="link-admin">Admin</a>
    </nav>
    <button class="botao botao--secundario botao--pequeno nao--encolhe" id="btn-sair">Sair</button>
  </header>
  <div class="hidden" id="aviso-assinatura"></div>

  <main class="conteudo flex flex--col gap--5">
    <form class="flex gap--2" id="form-busca">
      <input class="campo campo--busca" type="search" name="nome" placeholder="Nome da carta (ex.: Charizard)" autofocus>
      <button class="botao botao--primario" type="submit">Buscar</button>
    </form>

    <p class="hidden" id="aviso"></p>

    <div class="flex flex--wrap gap--4" id="resultados"></div>
  </main>

  <script type="module" src="../assets/js/buscar.js"></script>
</body>
</html>
