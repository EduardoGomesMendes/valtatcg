<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assinatura · valtatcg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global/global.css">
  <link rel="stylesheet" href="../assets/css/project/project.css">
</head>
<body class="app">
  <header class="topo flex items--center justify--content--between px--6 bg--surface border--bottom">
    <a href="/colecao/" class="flex items--center gap--2">
      <span class="marca--ponto bg--primary"></span>
      <span class="weight--bold tracking--tight">valtatcg</span>
    </a>
    <nav class="flex items--center gap--5 topo--links">
      <a href="/colecao/" class="nao--encolhe text--muted">Coleção</a>
      <a href="/buscar/" class="nao--encolhe text--muted">Buscar cartas</a>
      <a href="/assinatura/" class="nao--encolhe weight--semibold">Assinatura</a>
      <a href="/admin/" class="nao--encolhe text--muted hidden" id="link-admin">Admin</a>
    </nav>
    <div class="flex items--center gap--3 nao--encolhe">
      <a href="/perfil/" class="avatar-botao" title="Meu perfil">
        <img class="hidden" id="avatar-topo-imagem" alt="">
        <span id="avatar-topo-placeholder">?</span>
      </a>
      <button class="botao botao--secundario botao--pequeno" id="btn-sair">Sair</button>
    </div>
  </header>

  <main class="conteudo conteudo--estreito flex flex--col gap--5">
    <h1 class="text--xl weight--bold">Assinatura</h1>

    <section class="cartao p--5 flex flex--col gap--2" id="cartao-status">
      <span class="rotulo">Situação atual</span>
      <span class="text--lg weight--semibold" id="status-texto">Carregando…</span>
      <span class="text--sm text--muted" id="status-detalhe"></span>
    </section>

    <section class="cartao p--5 flex flex--col gap--3" id="cartao-assinar">
      <div class="flex flex--col gap--1">
        <h2 class="text--md weight--semibold">Plano mensal</h2>
        <span class="text--2xl weight--bold text--primary" id="preco-plano">—</span>
      </div>

      <form class="flex flex--col gap--3" id="form-assinar">
        <label class="flex flex--col gap--1">
          <span class="rotulo">CPF</span>
          <input class="campo" type="text" name="documento" inputmode="numeric" placeholder="000.000.000-00" required>
        </label>
        <label class="flex flex--col gap--1">
          <span class="rotulo">E-mail para cobrança</span>
          <input class="campo" type="email" name="email" placeholder="voce@exemplo.com">
        </label>
        <p class="hidden" id="aviso-assinar"></p>
        <button class="botao botao--primario w--full" type="submit" id="btn-assinar">Assinar agora</button>
      </form>

      <a class="hidden botao botao--secundario w--full" id="link-cobranca" href="#" target="_blank" rel="noopener">Ver cobrança pendente</a>
    </section>

    <section class="cartao p--5 flex flex--col gap--3 hidden" id="cartao-cancelar">
      <h2 class="text--md weight--semibold">Cancelar</h2>
      <p class="text--sm text--muted">A recorrência para no Asaas e sua conta passa a valer só até o fim do período já pago.</p>
      <button class="botao botao--perigo botao--pequeno" id="btn-cancelar" type="button">Cancelar assinatura</button>
    </section>
  </main>

  <footer class="rodape">
    <a href="https://omva.com.br" target="_blank" rel="noopener" class="text--xs text--muted">Desenvolvido por omva</a>
  </footer>

  <script type="module" src="../assets/js/assinatura.js"></script>
</body>
</html>
