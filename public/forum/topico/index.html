<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tópico do fórum · ValtaTCG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/global/global.css">
  <link rel="stylesheet" href="../../assets/css/project/project.css">
  <link rel="icon" href="/assets/img/logo-simbolo.svg" type="image/svg+xml">
</head>
<body class="app">
  <header class="topo flex items--center justify--content--between px--6 bg--surface border--bottom">
    <a href="/colecao/" class="flex items--center gap--2">
      <img class="marca--simbolo" src="/assets/img/logo-simbolo.svg" alt="" width="32" height="32">
      <span class="marca--texto"><span class="fonte--display">Valta</span> <span class="marca--tcg">TCG</span></span>
    </a>
    <nav class="flex items--center gap--5 topo--links">
      <a href="/colecao/" class="nao--encolhe text--muted">Coleção</a>
      <a href="/buscar/" class="nao--encolhe text--muted">Buscar cartas</a>
      <a href="/lojas/" class="nao--encolhe text--muted">Lojas</a>
      <a href="/eventos/" class="nao--encolhe text--muted">Eventos</a>
      <a href="/forum/" class="nao--encolhe weight--semibold">Fórum</a>
      <a href="/assinatura/" class="nao--encolhe text--muted">Assinatura</a>
      <a href="/admin/" class="nao--encolhe text--muted hidden" id="link-admin">Admin</a>
    </nav>
    <div class="menu--grupo nao--encolhe" id="menu-perfil">
      <button type="button" class="avatar-botao" id="btn-avatar-menu" aria-haspopup="true" aria-expanded="false" title="Menu da conta">
        <img class="hidden" id="avatar-topo-imagem" alt="">
        <span id="avatar-topo-placeholder">?</span>
      </button>
      <div class="menu--lista hidden" id="menu-avatar-lista">
        <a href="/perfil/" class="menu--item">Editar perfil</a>
        <a href="/minha-loja/" class="menu--item">Minha loja</a>
        <a href="/meus-eventos/" class="menu--item">Meus eventos</a>
        <span class="menu--item menu--item--desabilitado">Configurações</span>
        <button type="button" class="menu--item" id="btn-sair">Sair</button>
      </div>
    </div>
  </header>
  <div class="hidden" id="aviso-assinatura"></div>

  <main class="conteudo conteudo--estreito flex flex--col gap--5">
    <a href="/forum/" class="text--sm text--muted">← Voltar ao fórum</a>
    <p class="hidden" id="aviso"></p>

    <article class="cartao p--5 flex flex--col gap--3 hidden" id="cartao-topico">
      <div class="flex items--center gap--2 flex--wrap" id="selos-topico"></div>
      <h1 class="text--lg weight--bold" id="topico-titulo"></h1>
      <span class="text--xs text--muted" id="topico-meta"></span>
      <p class="corpo--texto text--sm" id="topico-corpo"></p>
      <div class="flex flex--wrap gap--2" id="acoes-topico"></div>
    </article>

    <h2 class="text--md weight--semibold hidden" id="titulo-respostas">Respostas</h2>
    <div class="flex flex--col gap--3" id="lista-respostas"></div>

    <div class="flex items--center gap--3 hidden" id="paginacao">
      <button class="botao botao--secundario botao--pequeno" type="button" id="btn-anterior">Anterior</button>
      <span class="text--sm text--muted" id="pagina-texto"></span>
      <button class="botao botao--secundario botao--pequeno" type="button" id="btn-proxima">Próxima</button>
    </div>

    <section class="cartao p--5 flex flex--col gap--3 hidden" id="cartao-responder">
      <h2 class="text--md weight--semibold">Responder</h2>
      <form class="flex flex--col gap--3" id="form-resposta">
        <textarea class="campo" name="corpo" rows="4" required minlength="2" maxlength="2000" aria-label="Sua resposta"></textarea>
        <span class="text--xs text--muted">Sem links, e-mails ou telefones. Seja respeitoso.</span>
        <p class="hidden" id="aviso-resposta"></p>
        <button class="botao botao--primario w--full" type="submit">Responder</button>
      </form>
    </section>
  </main>

  <footer class="rodape flex flex--col items--center gap--1">
    <a href="https://omva.com.br" target="_blank" rel="noopener" class="text--xs text--muted">Desenvolvido por omva</a>
    <p class="text--xs text--muted">OMVA ATENDIMENTO CONTINUO LTDA · CNPJ 69.724.570/0001-20</p>
  </footer>

  <script type="module" src="../../assets/js/forum-topico.js"></script>
</body>
</html>
